
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-testing-project
  labels:
    app: pipeline-testing-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline-testing-project
  template:
    metadata:
      labels:
        app: pipeline-testing-project
    spec:
      containers:
        - name: pipeline-testing-project
          image: muhammednashid/pipeline-testing-project:7
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"